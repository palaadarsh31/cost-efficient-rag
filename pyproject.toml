[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa"
version = "0.1.0"
description = "Grounded question answering over a document corpus on SQLite + sqlite-vec"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlite-vec>=0.1.6",
    "fastembed>=0.5",
    "numpy>=1.26",
    "pypdf>=4.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "Markdown>=3.6",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
docqa = "docqa.cli:main"
judgepipe = "judgepipe.cli:main"

[tool.setuptools.packages.find]
include = ["docqa*", "judgepipe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
